name: Release APK

# Publishes a signed GitHub Release whenever a v* tag is pushed,
# e.g. `git tag v1.6 && git push origin v1.6`.
#
# The release is created as a PRE-RELEASE (prerelease: true). The in-app
# updater reads /releases/latest, which ignores pre-releases, so tagging
# never pushes a build onto phones by itself. Test, then promote — see
# RELEASING.md.
#
# The in-app updater reads this release: it looks for update.json first
# (for the exact versionCode), then for app-release.apk.
#
# Signing secrets (set these once, from the key generated by
# .github/workflows/generate-key.yml - see SIGNING.md):
#   RELEASE_KEYSTORE_BASE64 - base64 of the release.keystore file
#   RELEASE_KEY_ALIAS       - key alias, e.g. blooddonation
#   RELEASE_STORE_PASSWORD  - keystore password
#   RELEASE_KEY_PASSWORD    - key password
# Supabase secrets (v1.3, repo > Settings > Secrets and variables > Actions):
#   SUPABASE_URL      - the Supabase project URL
#   SUPABASE_ANON_KEY - the project's legacy anon public key (NOT service_role)
# If the Supabase secrets are missing, the build still succeeds, but the
# baked-in anon key is empty and the app runs fully offline on SQLite.
# If any secret is missing, the job fails on purpose instead of
# publishing an unsigned APK that users could never update in place.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Restore release keystore from secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing. Run the generate-key workflow first (see SIGNING.md)."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            -PFIREBASE_APP_ID="$FIREBASE_APP_ID" \
            -PFIREBASE_API_KEY="$FIREBASE_API_KEY" \
            -PFIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
          # The keystore must not survive in the workspace after the build.
          rm -f app/release.keystore

      - name: Write update.json for the in-app updater
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          # versionCode and versionName must match app/build.gradle.kts.
          VERSION_CODE=$(grep -E 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          GRADLE_VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          # The in-app updater compares versionCode, not the tag, so a tag that
          # disagrees with Gradle publishes a release it will never offer.
          if [ "$VERSION_NAME" != "$GRADLE_VERSION_NAME" ]; then
            echo "Tag '$TAG' does not match versionName '$GRADLE_VERSION_NAME' in app/build.gradle.kts."
            echo "Bump versionName (and versionCode) before tagging."
            exit 1
          fi
          cat > update.json <<EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk",
            "tag": "$TAG"
          }
          EOF
          cat update.json

      # Published as a PRE-RELEASE on purpose. GitHub's /releases/latest
      # endpoint — the only thing the in-app updater reads — ignores
      # pre-releases, so a tag can never push itself onto phones that are
      # already on a published release. Test the APK from this page, then
      # promote it; see RELEASING.md and the note at the end of the body.
      - name: Publish GitHub Release with APK and update.json
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
          prerelease: true
          generate_release_notes: false
          body: |
            **Blood Donation 1.6**

            - Ask for blood directly in the app: post a request, and compatible
              donors can offer to help. A phone number is shown only after the
              requester accepts an offer.
            - Both sides confirm before a donation is recorded. Peer donations go
              on the donor's history and deliberately do not change blood-bank
              stock.
            - Browse other people's open requests, or your own; cancel your own;
              capped at three open requests.
            - "I'm available to donate" switch on your profile, plus a manager
              screen for reports.
            - A daily motivation card, donation milestones and an optional daily
              tip you can turn off in Settings.
            - An optional "Can I donate?" helper that gives general information
              and always says to ask a blood bank. Not medical advice.
            - Alerts for urgent requests now also cover offers and acceptances,
              and never show hospital or phone details on a locked screen.
            - Fixes: dark-mode contrast on the dashboard, honest messages when
              stock or a sync did not update, and a clearer warning when an
              account is offline-only.

            ---

            **This is a pre-release.** GitHub's `latest` endpoint ignores
            pre-releases, so the in-app updater does not offer this build to
            anyone yet. That is deliberate: test it first.

            **To promote it after testing** (this is the whole process):

            1. Install `app-release.apk` from this page and run the test plan.
            2. Untick "Set as a pre-release" on this page and save — or run
               `gh release edit <tag> --prerelease=false`.
            3. Nothing else changes. The APK and `update.json` are already
               attached, so from then on phones on the previous release are
               offered this versionCode.

            **To withdraw it instead:** delete the release and the tag (see
            RELEASING.md). The APK is never served from anywhere else.
