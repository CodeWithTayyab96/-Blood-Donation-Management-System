name: Release APK

# One workflow owns builds and releases now. There are no debug APKs anywhere:
# every build of this app is a signed release build, because an unsigned or
# debug-signed APK can never update an installed copy in place.
#
# On every push to main:
#   1. decide whether this commit ships (app/, build files or CHANGELOG.md
#      changed, and the message does not say [skip release]);
#   2. wait for the SQL checks run of the same commit and refuse to continue
#      unless it passed;
#   3. run the unit tests;
#   4. build the signed APK, guard the version, write update.json;
#   5. create the tag and publish a NORMAL release, which becomes Latest.
#
# A manual run (Actions -> Release APK -> Run workflow) does the same and can
# force a release from a commit that would otherwise be skipped.
#
# Signing secrets (names only — see SIGNING.md):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS, RELEASE_STORE_PASSWORD,
#   RELEASE_KEY_PASSWORD
# Optional: SUPABASE_URL, SUPABASE_ANON_KEY, FIREBASE_*.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if no app/build/CHANGELOG file changed"
        type: boolean
        default: false

permissions:
  contents: write   # tag + release
  actions: read     # read the SQL checks run for this commit

# Never run two releases for the same branch at once: the second would try to
# create a tag the first has just made.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags and history are needed for the guards

      - name: Decide whether this commit ships
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced from the Actions UI."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "${MESSAGE:-}" | grep -qi '\[skip release\]'; then
            echo "Commit message contains [skip release]."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..$SHA"
          fi
          CHANGED="$(git diff --name-only "$RANGE" || true)"
          echo "Changed files:"; echo "$CHANGED"
          # Only things that can change the APK, plus the changelog the release
          # notes come from. SQL-only and docs-only commits ship nothing.
          if printf '%s\n' "$CHANGED" | grep -qE '^(app/|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradle/|CHANGELOG\.md)'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing in app/, the build files or CHANGELOG.md changed — no release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      # The release is only allowed if the SQL checks passed for THIS commit.
      # They run in parallel (sql.yml), so this waits for that run to finish.
      - name: Wait for SQL checks on this commit
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            CONCLUSION=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "SQL checks")] | sort_by(.created_at) | last | .conclusion // ""')
            case "$CONCLUSION" in
              success)
                echo "SQL checks passed for $SHA."
                exit 0 ;;
              failure|cancelled|timed_out|action_required|stale)
                echo "::error::SQL checks finished '$CONCLUSION' for $SHA — not releasing."
                exit 1 ;;
              "")
                echo "SQL checks have not been created yet (attempt $attempt/24)."
                sleep 15 ;;
              *)
                echo "SQL checks are '$CONCLUSION' (attempt $attempt/24)."
                sleep 15 ;;
            esac
          done
          echo "::error::SQL checks did not finish within 6 minutes — not releasing."
          exit 1

      - name: Set up JDK 17
        if: steps.decide.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        if: steps.decide.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v3

      # The tests are the "Android tests" half of the gate. They compile the
      # app too, so a broken build fails here before anything is signed.
      - name: Unit tests
        if: steps.decide.outputs.should_release == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Read the version and enforce the guards
        if: steps.decide.outputs.should_release == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep -E 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          TAG="v$VERSION_NAME"
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE tag=$TAG"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Bump versionName (and versionCode) for this release."
            exit 1
          fi

          # versionCode must always increase: it is what the in-app updater
          # compares, and Android refuses to install a lower one over a higher.
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          PREV_CODE=0
          if [ -n "$PREV_TAG" ]; then
            if gh release download "$PREV_TAG" --pattern update.json --output /tmp/prev-update.json --clobber 2>/dev/null; then
              PREV_CODE=$(grep -oE '"versionCode"[^0-9]*[0-9]+' /tmp/prev-update.json | grep -oE '[0-9]+' | head -1 || echo 0)
            fi
          fi
          echo "Previous release: ${PREV_TAG:-none} (versionCode ${PREV_CODE:-0})"
          if [ "${PREV_CODE:-0}" -ge "$VERSION_CODE" ]; then
            echo "::error::versionCode $VERSION_CODE is not greater than the last release's $PREV_CODE. Bump versionCode (and versionName) in the same commit."
            exit 1
          fi

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore from secrets
        if: steps.decide.outputs.should_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing. See SIGNING.md."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build signed release APK
        if: steps.decide.outputs.should_release == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            -PFIREBASE_APP_ID="$FIREBASE_APP_ID" \
            -PFIREBASE_API_KEY="$FIREBASE_API_KEY" \
            -PFIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
          # The keystore must not survive in the workspace after the build.
          rm -f app/release.keystore

      - name: Write update.json
        if: steps.decide.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > update.json <<EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "https://github.com/$REPO/releases/download/$TAG/app-release.apk",
            "tag": "$TAG"
          }
          EOF
          cat update.json

      - name: Extract the release notes from CHANGELOG.md
        if: steps.decide.outputs.should_release == 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          # Everything under the "## <version>" heading, up to the next "## ".
          awk -v v="$VERSION_NAME" '
            /^## / {
              if (started) exit
              heading = $0
              sub(/^## /, "", heading)
              if (index(heading, v) == 1) {
                next_char = substr(heading, length(v) + 1, 1)
                if (next_char == "" || next_char == " " || next_char == "—") {
                  started = 1
                  next
                }
              }
            }
            started { print }
          ' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            printf '**Blood Donation %s**\n\nNo changelog entry for this version.\n' "$VERSION_NAME" > /tmp/notes.md
          fi
          echo "--- notes ---"; cat /tmp/notes.md

      - name: Tag and publish the release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Blood Donation $VERSION_NAME"
          git push origin "$TAG"
          # A normal release: it becomes Latest, which is what the in-app
          # updater reads (/releases/latest).
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --latest \
            app/build/outputs/apk/release/app-release.apk \
            update.json
