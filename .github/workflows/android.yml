name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No separate Android SDK setup step: ubuntu-latest runners already
      # ship the Android SDK (ANDROID_SDK_ROOT is pre-set), and the
      # android-actions/setup-android step was the step failing the run.
      # The Android Gradle Plugin finds the preinstalled SDK on its own.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blood-donation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
