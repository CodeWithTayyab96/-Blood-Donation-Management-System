name: CI (tests)

# Runs the unit tests on every branch and every pull request, so a change is
# verified before it reaches main. Tests compile the app, which is enough to
# catch a broken build.
#
# No APK is built here any more: debug builds are gone, and the only APK that
# exists is the signed one that "Release APK" builds on main. A pull request
# therefore cannot produce an installable artifact — by design, so nobody
# sideloads a build that can never update in place.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK with ANDROID_SDK_ROOT preset; the
      # Android Gradle Plugin finds it without a setup step (same as the
      # existing build workflow).
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Gradle reports success without saying how many tests ran, which makes a
      # green build hard to trust. Count them from the JUnit XML and put the
      # numbers on the run summary.
      - name: Summarise test results
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No test result files found — the test task did not run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tests=$(grep -ho '<testcase ' "${files[@]}" | wc -l | tr -d ' ')
          failures=$(grep -ho '<failure' "${files[@]}" | wc -l | tr -d ' ')
          errors=$(grep -ho '<error' "${files[@]}" | wc -l | tr -d ' ')
          {
            echo "### Unit tests"
            echo ""
            echo "| Tests | Failures | Errors |"
            echo "|-------|----------|--------|"
            echo "| $tests | $failures | $errors |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Ran $tests tests: $failures failures, $errors errors"

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
