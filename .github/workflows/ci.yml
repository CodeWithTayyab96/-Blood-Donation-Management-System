name: CI (tests + debug APK)

# Runs unit tests and a debug build on every branch and every pull request, so
# a change is verified before it reaches main.
#
# The existing "Build Android APK" workflow only triggers on push to main and
# never runs the test task, which is why this file exists. It deliberately
# skips main to avoid building the same thing twice; that workflow still owns
# the main-branch APK.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK with ANDROID_SDK_ROOT preset; the
      # Android Gradle Plugin finds it without a setup step (same as the
      # existing build workflow).
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Gradle reports success without saying how many tests ran, which makes a
      # green build hard to trust. Count them from the JUnit XML and put the
      # numbers on the run summary.
      - name: Summarise test results
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No test result files found — the test task did not run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tests=$(grep -ho '<testcase ' "${files[@]}" | wc -l | tr -d ' ')
          failures=$(grep -ho '<failure' "${files[@]}" | wc -l | tr -d ' ')
          errors=$(grep -ho '<error' "${files[@]}" | wc -l | tr -d ' ')
          {
            echo "### Unit tests"
            echo ""
            echo "| Tests | Failures | Errors |"
            echo "|-------|----------|--------|"
            echo "| $tests | $failures | $errors |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Ran $tests tests: $failures failures, $errors errors"

      # No secrets are required: with an empty anon key the app builds and runs
      # fully offline, which is exactly what a CI build needs.
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ./gradlew assembleDebug --stacktrace \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blood-donation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
